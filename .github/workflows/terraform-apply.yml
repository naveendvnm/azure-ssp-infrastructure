name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-nonprod
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Terraform Apply - NonProd
    runs-on: ubuntu-latest
    environment: nonprod

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_storage_account_name: ${{ vars.TF_STORAGE_ACCOUNT_NAME }}
      TF_VAR_key_vault_name: ${{ vars.TF_KEY_VAULT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          az account show
          az group list --output table

      - name: Terraform Format Check
        working-directory: terraform/environments/nonprod
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform/environments/nonprod
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform/environments/nonprod
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/environments/nonprod
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/nonprod
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Output
        working-directory: terraform/environments/nonprod
        run: terraform output

      - name: Verify Deployment
        run: |
          echo "Checking NonProd resource group..."
          az group show \
            --name azure-ssp-nonprod-rg \
            --output table

          echo "Deployment verification completed."
